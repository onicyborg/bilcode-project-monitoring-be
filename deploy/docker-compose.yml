name: bilcode-monitoring-backend
services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE in .deployment.env}
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        format: raw
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4100
    ports:
      - 127.0.0.1:4100:4100
    networks:
      application:
        aliases: [bilcode-monitoring-api]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  application:
    name: bilcode-monitoring-services
    external: true
